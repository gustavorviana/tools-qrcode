<!-- Contato (vCard) -->
<div class="fgroup" data-fields="vcard">
  <label class="fld req" for="f_vcname">Nome completo</label>
  <input type="text" id="f_vcname" placeholder="Maria Silva">
  <label class="fld" for="f_vctel" style="margin-top:12px">Telefone</label>
  <input type="text" id="f_vctel" placeholder="(11) 99999-9999" inputmode="tel">
  <label class="fld" for="f_vcemail" style="margin-top:12px">E-mail</label>
  <input type="text" id="f_vcemail" placeholder="email@exemplo.com" inputmode="email">
  <div class="row" style="margin-top:12px">
    <div>
      <label class="fld" for="f_vcorg">Empresa</label>
      <input type="text" id="f_vcorg" placeholder="Empresa">
    </div>
    <div>
      <label class="fld" for="f_vctitle">Cargo</label>
      <input type="text" id="f_vctitle" placeholder="Cargo">
    </div>
  </div>
  <label class="fld" for="f_vcurl" style="margin-top:12px">Site (opcional)</label>
  <input type="text" id="f_vcurl" placeholder="exemplo.com" inputmode="url">
</div>
