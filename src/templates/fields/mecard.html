<!-- MeCard -->
<div class="fgroup" data-fields="mecard">
  <label class="fld req" for="f_mcname">Nome completo</label>
  <input type="text" id="f_mcname" placeholder="Maria Silva">
  <label class="fld" for="f_mctel" style="margin-top:12px">Telefone</label>
  <input type="text" id="f_mctel" placeholder="(11) 99999-9999" inputmode="tel">
  <label class="fld" for="f_mcemail" style="margin-top:12px">E-mail</label>
  <input type="text" id="f_mcemail" placeholder="email@exemplo.com" inputmode="email">
</div>
