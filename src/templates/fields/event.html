<!-- Evento (calendário) -->
<div class="fgroup" data-fields="event">
  <label class="fld req" for="f_evtitle">Título do evento</label>
  <input type="text" id="f_evtitle" placeholder="Reunião de equipe">
  <label class="fld" for="f_evloc" style="margin-top:12px">Local (opcional)</label>
  <input type="text" id="f_evloc" placeholder="Sala 3 / endereço">
  <div class="row" style="margin-top:12px">
    <div>
      <label class="fld req" for="f_evstart">Início</label>
      <input type="datetime-local" id="f_evstart">
    </div>
    <div>
      <label class="fld" for="f_evend">Fim (opcional)</label>
      <input type="datetime-local" id="f_evend">
    </div>
  </div>
</div>
